name: CI

on:
  push:
    # 只监听 master。功能分支的验证交给 pull_request —— 旧配置写的 ['*'] 并不匹配带
    # 斜杠的分支名（本仓库分支规范是 <type>/<slug>），实测全历史 push 事件 0 次命中
    # 功能分支，等于没触发（见 ADR 2026-09-29-ci-verification-boundary）。
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # master 的运行永不被取消：合并后的复核是「这份代码在 master 上验证过」的唯一证据，
  # 被下一次合并取消会让 master 静默处于未验证状态（旧配置实测近 30 次里 11 次 cancelled）。
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # 静态验证 + 构建：core:build → lint → design-lint → 双端 typecheck → build
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # 验证命令的唯一出处是 scripts/verify.sh，CI 不再自己拼步骤（避免文档/CI 漂移）
      - run: ./scripts/verify.sh static

  # 四套测试拆成独立分片并行跑（矩阵的每个 entry 是一个独立 job / 独立 check 名）：
  # renderer（renderer + src/__tests__ 顶层）/ main（node env）/ core / mobile
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # 一片失败不连坐取消其余片，失败定位与重跑都只影响一片
      fail-fast: false
      matrix:
        scope: [renderer, main, core, mobile]
    name: test (${{ matrix.scope }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: ./scripts/verify.sh ${{ matrix.scope }}

  # Expo SDK 依赖一致性：依赖集偏离 SDK 期望版本时红。
  # 这是 #478 那类事故的廉价网 —— 秒级、不需要 Gradle/keystore，
  # 因此不必为了它恢复「PR 期跑原生构建」（见 ADR 2026-09-29-dependency-update-governance）。
  # 注意：它读 Expo 远端 SDK 元数据，上游发新期望补丁时会独立变红，
  # 红了跑 expo install --fix 即可，与仓库改动无关。
  expo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: ./scripts/verify.sh expo
