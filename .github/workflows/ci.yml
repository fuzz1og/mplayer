name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Build core first (desktop/mobile import @mplayer/core from its dist/)
      - run: npm run core:build
      # Root (Electron)
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # Mobile typecheck
      - run: npx tsc --noEmit --project packages/mobile/tsconfig.json
      # Mobile tests
      - run: npx vitest run --config packages/mobile/vitest.config.ts

  # Mobile Android APK
  mobile-android:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json', 'packages/mobile/package.json', 'packages/mobile/app.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - run: npm ci --ignore-scripts
      - run: npm run core:build
      - name: Prebuild Android native project
        working-directory: packages/mobile
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_DEBUG: 1
      - name: Build APK (release)
        working-directory: packages/mobile/android
        run: ./gradlew assembleRelease
        env:
          GRADLE_OPTS: "-Xmx4096m"
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: mplayer-mobile-apk
          path: packages/mobile/android/app/build/outputs/apk/release/*.apk
