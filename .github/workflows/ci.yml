name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Build core first (desktop/mobile import @mplayer/core from its dist/)
      - run: npm run core:build
      # Root (Electron)
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # Mobile typecheck
      - run: npx tsc --noEmit --project packages/mobile/tsconfig.json
      # Mobile tests
      - run: npx vitest run --config packages/mobile/vitest.config.ts

  # Mobile Android APK
  mobile-android:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      # Gradle 官方 setup：自动缓存依赖(modules-2)/Build Cache(build-cache-1)/
      # transforms-3(AAR 解包)/wrapper，配 gradle.properties 的 org.gradle.caching=true
      # 二次构建命中绝大多数编译产物。注意：不要与 actions/cache / setup-java cache:gradle 混用；
      # setup-gradle 没有 cache 这个 input（那是 setup-java 的写法），写了会报 Unexpected input 警告且无效。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: false
      - run: npm ci --ignore-scripts
      - run: npm run core:build
      # android 原生目录已提交进 git（CNG 反向），直接增量构建 —— 与 release.yml 一致。
      # prebuild --clean 会重写原生目录，等于每次冷启动，把上面的 Gradle 缓存收益抵消掉。
      - name: Build APK (release)
        working-directory: packages/mobile/android
        run: ./gradlew assembleRelease
        env:
          GRADLE_OPTS: "-Xmx4096m"
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: mplayer-mobile-apk
          path: packages/mobile/android/app/build/outputs/apk/release/*.apk
