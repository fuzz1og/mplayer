name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      # Root (Electron)
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # Mobile typecheck
      - run: npm run core:build
      - run: npx tsc --noEmit --project packages/mobile/tsconfig.json

  # Mobile Android APK
  mobile-android:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --ignore-scripts
      - run: npm run core:build
      - name: Prebuild Android native project
        working-directory: packages/mobile
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_DEBUG: 1
      - name: Copy icon fonts to Android assets (lowercase names)
        working-directory: packages/mobile
        run: |
          ICON_FONTS_DIR="../../node_modules/@expo/vector-icons/build/vendor/react-native-vector-icons/Fonts"
          ASSETS_DIR="android/app/src/main/assets/fonts"
          mkdir -p "$ASSETS_DIR"
          for f in "$ICON_FONTS_DIR"/*.ttf; do
            name=$(basename "$f" | tr '[:upper:]' '[:lower:]')
            cp "$f" "$ASSETS_DIR/$name"
          done
          echo "Copied $(ls -1 "$ASSETS_DIR"/*.ttf 2>/dev/null | wc -l) icon fonts to $ASSETS_DIR"
      - name: Build APK (release)
        working-directory: packages/mobile/android
        run: ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mplayer-mobile-apk
          path: packages/mobile/android/app/build/outputs/apk/release/*.apk
