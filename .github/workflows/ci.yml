name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      # Root (Electron)
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # Mobile typecheck
      - run: npm run core:build
      - run: npx tsc --noEmit --project packages/mobile/tsconfig.json

  # Mobile web export — verify Metro bundle for web
  mobile-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run core:build
      - name: Expo export (web)
        working-directory: packages/mobile
        run: npx expo export --platform web

  # Mobile Android APK
  mobile-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --ignore-scripts
      - run: npm run core:build
      - name: Prebuild Android native project
        working-directory: packages/mobile
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_DEBUG: 1
      - name: Eager bundle JS + assets
        working-directory: packages/mobile
        run: |
          mkdir -p dist-eager
          node scripts/eager-bundle-android.cjs dist-eager/eager-options.json
          echo "__EXPO_EAGER_BUNDLE_OPTIONS=$(cat dist-eager/eager-options.json)" >> "$GITHUB_ENV"
      - name: Build APK (release)
        working-directory: packages/mobile/android
        run: ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mplayer-mobile-apk
          path: packages/mobile/android/app/build/outputs/apk/release/*.apk
