# CI — typecheck + build on every push

on:
  push:
    branches: ['*']
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      # Root (Electron)
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # Mobile
      - run: npm run core:build
      - run: npx tsc --noEmit --project packages/mobile/tsconfig.json
