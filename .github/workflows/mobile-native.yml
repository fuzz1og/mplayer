name: Mobile Native

# 原生 Android 构建的验证闸门（见 ADR 2026-09-29-ci-verification-boundary）。
#
# 为什么不是「每次 push 都跑」：一次完整的 release 构建要几分钟到十几分钟，而绝大多数
# 改动只碰 JS/TS —— typecheck/lint/单测根本不编译 Kotlin。反过来，原生被动到时必须有
# 人验：历史上 2026-07-31 的工具链不兼容（5 次 Kotlin/Gradle）与 2026-09-12 的 Android
# release bundle 都是这条路径抓到的。所以这里按「原生相关路径」触发，而不是按时间/次数。
#
# 命令与 release.yml 的 build-mobile 对齐（assembleRelease bundleRelease --no-daemon）：
# 只跑 assembleRelease 会漏掉 AAB 的 packageReleaseBundle —— v1.7.3 正是只炸在这条
# 从未在 CI 执行过的路径上（Java heap space）。
on:
  pull_request:
    branches: [master]
    paths: &native-paths
      - 'packages/mobile/android/**'
      - 'packages/mobile/modules/**'
      - 'packages/mobile/app.json'
      - 'packages/mobile/package.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-native.yml'
  push:
    branches: [master]
    paths: *native-paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      # Gradle 官方 setup：自动缓存依赖(modules-2)/Build Cache/build-cache-1/transforms-3/
      # wrapper。注意不要与 actions/cache / setup-java cache:gradle 混用。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: false
      - run: npm ci --ignore-scripts
      - run: npm run core:build
      # 这是「能不能构建」的闸门，不是发布产物：故意不解码 ANDROID_KEYSTORE_*，
      # 让 build.gradle 走「无 env 回退 debug 签名」——fork PR 拿不到 secrets，
      # 若在这里强制 release 签名会让所有外部 PR 直接红。
      - name: Build APK + AAB (release)
        working-directory: packages/mobile/android
        run: ./gradlew assembleRelease bundleRelease --no-daemon
        env:
          GRADLE_OPTS: "-Xmx4096m"
