name: Build & Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build platform'
        type: choice
        options:
          - mobile-only
          - all
        default: mobile-only
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event.inputs.platform != 'mobile-only' || github.event_name == 'push' }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npx tsc && npx vite build

      - run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Mobile Android APK
  mobile-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --ignore-scripts
      - run: npm run core:build
      - name: Prebuild Android native project
        working-directory: packages/mobile
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_DEBUG: 1
      - name: Build APK (release)
        working-directory: packages/mobile/android
        run: ./gradlew assembleRelease
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mplayer-mobile-apk
          path: packages/mobile/android/app/build/outputs/apk/release/*.apk

  publish:
    needs: [build, mobile-android]
    if: ${{ always() && !cancelled() && needs.mobile-android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: mplayer-mobile-apk

      - name: Generate release notes and publish
        run: |
          TAG="${{ github.ref_name }}"
          # Generate release notes and save to file
          gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="$TAG" --jq '.body' > release-notes.md
          # Publish release with generated notes
          gh release edit "$TAG" --notes-file release-notes.md --draft=false
          # Upload APK to release assets
          for apk in *.apk; do
            [ -f "$apk" ] && gh release upload "$TAG" "$apk" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-to-gitee:
    needs: publish
    if: ${{ always() && !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all release assets
        run: |
          TAG="${{ github.ref_name }}"
          gh release download "$TAG" --dir ./assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync release to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: aris3104/mplayer
        run: |
          TAG="${{ github.ref_name }}"

          # Generate release notes
          BODY=$(gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="$TAG" --jq '.body')

          # Ensure tag exists on Gitee
          curl -s -X POST "https://gitee.com/api/v5/repos/$GITEE_REPO/tags" \
            -H "Content-Type: application/json" \
            -d "{
              \"access_token\": \"$GITEE_TOKEN\",
              \"tag_name\": \"$TAG\",
              \"refs\": \"master\"
            }" || true

          # Create release on Gitee
          RELEASE_ID=$(curl -s -X POST "https://gitee.com/api/v5/repos/$GITEE_REPO/releases" \
            -H "Content-Type: application/json" \
            -d "{
              \"access_token\": \"$GITEE_TOKEN\",
              \"tag_name\": \"$TAG\",
              \"name\": \"$TAG\",
              \"body\": $(echo "$BODY" | jq -Rs '.'),
              \"prerelease\": false
            }" | jq -r '.id // empty')

          echo "Gitee release ID: $RELEASE_ID"

          # Upload each asset to Gitee
          for file in ./assets/*; do
            [ -f "$file" ] || continue
            echo "Uploading: $(basename "$file")"
            curl -s -X POST \
              "https://gitee.com/api/v5/repos/$GITEE_REPO/releases/$RELEASE_ID/attach_file" \
              -F "access_token=$GITEE_TOKEN" \
              -F "file=@$file"
          done
