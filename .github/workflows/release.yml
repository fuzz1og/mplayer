name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (e.g. 1.4.0). Auto-bump all files, commit, create tag, then build all platforms.'
        required: false
      platform:
        description: 'Target platform (only for test builds without version)'
        type: choice
        options:
          - all
          - desktop-only
          - mobile-only
        default: all
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Create version tag (dispatch with version only) ──
  create-tag:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
      tag: v${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Bump version across all files
        run: node scripts/version-bump.js ${{ inputs.version }}

      - name: Commit and create tag
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: bump version to ${{ inputs.version }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git tag -f v${{ inputs.version }}
          # Push commit only — don't push tag (avoids duplicate tag-push workflow)
          git push origin HEAD

  # ════════════════════════════════════════════════════════
  # Build jobs — run on tag push OR dispatch without version
  # ════════════════════════════════════════════════════════

  # ── Desktop (Electron) build ──
  build-desktop:
    needs: [create-tag]
    if: |
      !failure() && !cancelled()
      && (github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && inputs.platform != 'mobile-only'))
    strategy:
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Use bumped commit when dispatched with version, else default
          ref: ${{ needs.create-tag.outputs.commit_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      # 先构建 core（桌面端从 @mplayer/core 的 dist 导入；dist 是 gitignored，
      # 干净环境必须显式构建，否则 tsc 报 Cannot find module '@mplayer/core'）
      - run: npm run core:build

      - run: npx tsc && npx vite build

      # Tag push or dispatch with version = official release → publish
      - name: Build + publish to GitHub Releases
        if: github.event_name == 'push' || inputs.version != ''
        run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Dispatch without version (test build) → build only
      - name: Build only (test)
        if: github.event_name != 'push' && inputs.version == ''
        run: npx electron-builder ${{ matrix.args }}

  # ── Mobile Android APK ──
  build-mobile:
    needs: [create-tag]
    if: |
      !failure() && !cancelled()
      && (github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && inputs.platform != 'desktop-only'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-tag.outputs.commit_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci --ignore-scripts
      - run: npm run core:build

      - name: Prebuild Android native project
        working-directory: packages/mobile
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_DEBUG: 1

      - name: Build APK (release)
        working-directory: packages/mobile/android
        run: ./gradlew assembleRelease
        env:
          GRADLE_OPTS: "-Xmx4096m"

      # gradle 默认产物名是 app-release.apk；这里按「应用名 + 版本号」重命名，
      # 例如 MPlayer-v1.7.0.apk（与 electron-builder 桌面产物命名风格一致）
      - name: Rename APK with app name + version
        working-directory: packages/mobile/android/app/build/outputs/apk/release
        run: |
          VERSION=$(node -p "require('/home/runner/work/mplayer/mplayer/package.json').version")
          for apk in *.apk; do
            [ -f "$apk" ] || continue
            mv "$apk" "MPlayer-v${VERSION}.apk"
          done
          ls -la

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: mplayer-mobile-apk
          path: packages/mobile/android/app/build/outputs/apk/release/*.apk

  # ── Publish release ──
  publish:
    needs: [build-desktop, build-mobile]
    if: |
      always() && !cancelled()
      && needs.build-mobile.result == 'success'
      && (github.event_name == 'push' || inputs.version != '')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.version }}" ]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: mplayer-mobile-apk

      - name: Create or edit release
        run: |
          TAG="${{ steps.tag.outputs.tag }}"

          if [ -z "$TAG" ]; then
            echo "No tag — skipping release publish"
            exit 0
          fi

          # Push tag for dispatch-with-version (create-tag only creates it locally)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f "$TAG"
            git push origin "$TAG" --force
          fi

          # Generate release notes
          gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="$TAG" --jq '.body' > release-notes.md

          # Create if not exists, otherwise edit
          if gh release view "$TAG" &>/dev/null; then
            gh release edit "$TAG" --notes-file release-notes.md --draft=false
          else
            gh release create "$TAG" --notes-file release-notes.md --draft=false
          fi

          # Upload APK to release assets
          for apk in *.apk; do
            [ -f "$apk" ] && gh release upload "$TAG" "$apk" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Sync release assets to Gitee ──
  sync-to-gitee:
    needs: publish
    if: |
      always() && !cancelled() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.version }}" ]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all release assets
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          [ -z "$TAG" ] && exit 0
          gh release download "$TAG" --dir ./assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync release to Gitee
        if: steps.tag.outputs.tag != ''
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: aris3104/mplayer
        run: |
          TAG="${{ steps.tag.outputs.tag }}"

          # Generate release notes
          BODY=$(gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="$TAG" --jq '.body')

          # Ensure tag exists on Gitee
          curl -s -X POST "https://gitee.com/api/v5/repos/$GITEE_REPO/tags" \
            -H "Content-Type: application/json" \
            --connect-timeout 10 --max-time 30 \
            -d "{
              \"access_token\": \"$GITEE_TOKEN\",
              \"tag_name\": \"$TAG\",
              \"refs\": \"master\"
            }" || echo "Tag creation skipped (may already exist)"

          # Create release on Gitee
          echo "--- Creating Gitee release for $TAG ---"
          RELEASE_RESP=$(curl -s -X POST "https://gitee.com/api/v5/repos/$GITEE_REPO/releases" \
            -H "Content-Type: application/json" \
            --connect-timeout 10 --max-time 30 \
            -d "{
              \"access_token\": \"$GITEE_TOKEN\",
              \"tag_name\": \"$TAG\",
              \"name\": \"$TAG\",
              \"body\": $(echo "$BODY" | jq -Rs '.'),
              \"prerelease\": false,
              \"target_commitish\": \"master\"
            }")
          echo "Gitee response: $RELEASE_RESP"
          RELEASE_ID=$(echo "$RELEASE_RESP" | jq -r '.id // empty')

          echo "Gitee release ID: $RELEASE_ID"
          if [ -z "$RELEASE_ID" ]; then
            echo "Release already exists — fetching existing release ID"
            RELEASE_ID=$(curl -s "https://gitee.com/api/v5/repos/$GITEE_REPO/releases/tags/$TAG?access_token=$GITEE_TOKEN"               --connect-timeout 10 --max-time 30 | jq -r '.id // empty')
            echo "Existing release ID: $RELEASE_ID"
            if [ -z "$RELEASE_ID" ]; then
              echo "No Gitee release found — check GITEE_TOKEN and repo permissions"
              exit 0
            fi
          fi

          # Upload each asset to Gitee.
          # Gitee 上传慢（实测 <150KB/s，1.2GB 总量需数小时）：小文件先传、
          # 单文件 1h 超时 + 重试 1 次、失败不中断 job（重跑时跳过已传的）
          # 注意：Gitee API 单文件上限 100MB。桌面端产物（exe/AppImage/dmg 等）
          # 普遍超限必然 FAIL，这是平台硬限制；据此决定哪些 latest*.yml 元数据
          # 才能上传——产物没传上去的元数据只会指向死链，宁可不传。
          EXISTING=$(curl -s "https://gitee.com/api/v5/repos/$GITEE_REPO/releases/$RELEASE_ID" \
            --connect-timeout 10 --max-time 30 | jq -r '.assets[].name')
          RESULT_FILE=$(mktemp)
          upload_file() {
            local file="$1" base status resp dl_url
            base=$(basename "$file")
            case "$base" in
              *.dmg|*.dmg.blockmap) echo "SKIP $base (mac 端不做)"; status=skip ;;
              latest*.yml) echo "SKIP $base (元数据按需上传)"; status=skip ;;
              *)
                if echo "$EXISTING" | grep -qx "$base"; then
                  echo "SKIP $base (already uploaded)"; status=ok
                else
                  echo "Uploading: $base"
                  for attempt in 1 2; do
                    resp=$(curl -s -X POST \
                      "https://gitee.com/api/v5/repos/$GITEE_REPO/releases/$RELEASE_ID/attach_files" \
                      --connect-timeout 10 --max-time 3600 \
                      -F "access_token=$GITEE_TOKEN" \
                      -F "file=@$file" || true)
                    dl_url=$(echo "$resp" | jq -r '.browser_download_url // empty')
                    [ -n "$dl_url" ] && break
                    echo "Retry $attempt — $resp"
                  done
                  if [ -n "$dl_url" ]; then
                    echo "OK $base → $dl_url"; status=ok
                  else
                    echo "FAIL $base — $resp"; status=fail
                  fi
                fi
                ;;
            esac
            echo "$base=$status" >> "$RESULT_FILE"
          }
          for file in $(ls -S ./assets/* | tac); do
            [ -f "$file" ] || continue
            upload_file "$file"
          done

          # ── 条件上传 electron-updater 元数据（避免死链）──
          # Windows 更新吃 latest.yml（对应 Setup exe）；Linux 吃 latest-linux.yml（AppImage/deb）；
          # mac 从不同步产物，latest-mac.yml 一律不上传。
          win_ok=false; linux_ok=false
          while IFS='=' read -r base status; do
            case "$base" in
              MPlayer-Setup-*.exe|MPlayer-*.exe) [ "$status" = ok ] && win_ok=true ;;
              MPlayer-*.AppImage|*_amd64.deb) [ "$status" = ok ] && linux_ok=true ;;
            esac
          done < "$RESULT_FILE"
          for meta in latest.yml latest-linux.yml latest-mac.yml; do
            [ -f "./assets/$meta" ] || continue
            need=false
            case "$meta" in
              latest.yml) [ "$win_ok" = true ] && need=true ;;
              latest-linux.yml) [ "$linux_ok" = true ] && need=true ;;
              latest-mac.yml) need=false ;;
            esac
            if [ "$need" = true ]; then
              curl -s -X POST \
                "https://gitee.com/api/v5/repos/$GITEE_REPO/releases/$RELEASE_ID/attach_files" \
                --connect-timeout 10 --max-time 300 \
                -F "access_token=$GITEE_TOKEN" \
                -F "file=@./assets/$meta" | jq -r 'if .browser_download_url then "OK \(.name) → \(.browser_download_url)" else "FAIL \(.name) — \(.)" end'
            else
              echo "SKIP $meta (对应产物未上传成功，跳过以避免更新死链)"
            fi
          done
