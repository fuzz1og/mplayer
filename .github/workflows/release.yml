name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npx tsc && npx vite build

      - run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate release notes and publish
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"

          # Generate release notes via GitHub API
          NOTES=$(gh api repos/$REPO/releases/generate-notes -f tag_name="$TAG" --jq '.body')

          # Update release: set notes + publish (draft=false)
          gh api repos/$REPO/releases/tags/$TAG \
            -X PATCH \
            -f body="$NOTES" \
            -F draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
