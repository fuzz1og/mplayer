name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (e.g. 1.4.0). Auto-bump all files, commit, create tag, then build all platforms.'
        required: false
      platform:
        description: 'Target platform (only for test builds without version)'
        type: choice
        options:
          - all
          - desktop-only
          - mobile-only
        default: all
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Create version tag (dispatch with version only) ──
  create-tag:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
      tag: v${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run core:build

      - name: Bump version across all files
        run: node scripts/version-bump.js ${{ inputs.version }}

      - name: Commit and create tag
        id: commit
        run: |
          # 启用仓库 pre-commit 钩子（typecheck root+mobile + lint），让 bump commit 也过验证
          git config core.hooksPath .githooks
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: bump version to ${{ inputs.version }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git tag -f v${{ inputs.version }}
          # Push commit only — don't push tag (avoids duplicate tag-push workflow)
          git push origin HEAD

  # ════════════════════════════════════════════════════════
  # Build jobs — run on tag push OR dispatch without version
  # ════════════════════════════════════════════════════════

  # ── Desktop (Electron) build ──
  build-desktop:
    needs: [create-tag]
    if: |
      !failure() && !cancelled()
      && (github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && inputs.platform != 'mobile-only'))
    strategy:
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Use bumped commit when dispatched with version, else default
          ref: ${{ needs.create-tag.outputs.commit_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      # 先构建 core（桌面端从 @mplayer/core 的 dist 导入；dist 是 gitignored，
      # 干净环境必须显式构建，否则 tsc 报 Cannot find module '@mplayer/core'）
      - run: npm run core:build

      # 发布前跑测试：直接 push master 发版时 ci.yml 可能并行未完成，release 构建自带验证兜底
      - run: npx tsc && npx vitest run && npx vite build

      # Tag push or dispatch with version = official release → publish
      - name: Build + publish to GitHub Releases
        if: github.event_name == 'push' || inputs.version != ''
        run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Dispatch without version (test build) → build only
      - name: Build only (test)
        if: github.event_name != 'push' && inputs.version == ''
        run: npx electron-builder ${{ matrix.args }}

  # ── Mobile Android APK ──
  build-mobile:
    needs: [create-tag]
    if: |
      !failure() && !cancelled()
      && (github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && inputs.platform != 'desktop-only'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-tag.outputs.commit_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Gradle 依赖缓存（对齐 ci.yml mobile-android）：首次构建下载依赖后缓存，
      # 之后发布构建直接命中，显著缩短 build-mobile 耗时。
      # key 只用 package-lock.json——gradle 依赖与版本号（app.json/package.json 的 version）
      # 无关，避免每次 bump 版本导致缓存失效（v1.7.0→v1.7.1 实测白跑 15 分钟 gradle）
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - run: npm ci --ignore-scripts
      - run: npm run core:build

      - name: Prebuild Android native project
        working-directory: packages/mobile
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_DEBUG: 1

      - name: Build APK (release)
        working-directory: packages/mobile/android
        run: ./gradlew assembleRelease
        env:
          GRADLE_OPTS: "-Xmx4096m"

      # gradle 默认产物名是 app-release.apk；这里按「应用名 + 版本号」重命名，
      # 例如 MPlayer-v1.7.0.apk（与 electron-builder 桌面产物命名风格一致）
      - name: Rename APK with app name + version
        working-directory: packages/mobile/android/app/build/outputs/apk/release
        run: |
          VERSION=$(node -p "require('/home/runner/work/mplayer/mplayer/package.json').version")
          for apk in *.apk; do
            [ -f "$apk" ] || continue
            mv "$apk" "MPlayer-v${VERSION}.apk"
          done
          ls -la

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: mplayer-mobile-apk
          path: packages/mobile/android/app/build/outputs/apk/release/*.apk

  # ── Publish release ──
  publish:
    needs: [build-desktop, build-mobile]
    if: |
      always() && !cancelled()
      && needs.build-mobile.result == 'success'
      && (github.event_name == 'push' || inputs.version != '')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.version }}" ]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: mplayer-mobile-apk

      - name: Create or edit release
        run: |
          TAG="${{ steps.tag.outputs.tag }}"

          if [ -z "$TAG" ]; then
            echo "No tag — skipping release publish"
            exit 0
          fi

          # Push tag for dispatch-with-version (create-tag only creates it locally)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f "$TAG"
            git push origin "$TAG" --force
          fi

          # Generate release notes
          gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="$TAG" --jq '.body' > release-notes.md

          # Create if not exists, otherwise edit
          if gh release view "$TAG" &>/dev/null; then
            gh release edit "$TAG" --notes-file release-notes.md --draft=false
          else
            gh release create "$TAG" --notes-file release-notes.md --draft=false
          fi

          # Upload APK to release assets
          for apk in *.apk; do
            [ -f "$apk" ] && gh release upload "$TAG" "$apk" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

