name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npx tsc && npx vite build

      - run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Mobile Android APK
  mobile-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --ignore-scripts
      - run: npm run core:build
      - name: Prebuild Android native project
        working-directory: packages/mobile
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_DEBUG: 1
      - name: Copy vector icon fonts to Android assets
        working-directory: packages/mobile
        run: |
          ANDROID_ASSETS="android/app/src/main/assets/fonts"
          ICON_FONTS="../../node_modules/@expo/vector-icons/build/vendor/react-native-vector-icons/Fonts"
          mkdir -p "$ANDROID_ASSETS"
          cp "$ICON_FONTS"/*.ttf "$ANDROID_ASSETS/"
          echo "Copied $(ls -1 "$ANDROID_ASSETS"/*.ttf 2>/dev/null | wc -l) icon fonts to $ANDROID_ASSETS"
      - name: Build APK (release)
        working-directory: packages/mobile/android
        run: ./gradlew assembleRelease
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mplayer-mobile-apk
          path: packages/mobile/android/app/build/outputs/apk/release/*.apk

  publish:
    needs: [build, mobile-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: mplayer-mobile-apk

      - name: Generate release notes and publish
        run: |
          TAG="${{ github.ref_name }}"
          # Generate release notes and save to file
          gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="$TAG" --jq '.body' > release-notes.md
          # Publish release with generated notes
          gh release edit "$TAG" --notes-file release-notes.md --draft=false
          # Upload APK to release assets
          for apk in *.apk; do
            [ -f "$apk" ] && gh release upload "$TAG" "$apk" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
