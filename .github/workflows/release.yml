name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (e.g. 1.4.0). Auto-bump all files, commit, create tag, then build all platforms.'
        required: false
      platform:
        description: 'Target platform (only for test builds without version)'
        type: choice
        options:
          - all
          - desktop-only
          - mobile-only
        default: all
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Create version tag (dispatch with version only) ──
  create-tag:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
      tag: v${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run core:build

      - name: Bump version across all files
        run: node scripts/version-bump.js ${{ inputs.version }}

      - name: Commit and create tag
        id: commit
        run: |
          # 启用仓库 pre-commit 钩子（typecheck root+mobile + lint），让 bump commit 也过验证
          git config core.hooksPath .githooks
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: bump version to ${{ inputs.version }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git tag -f v${{ inputs.version }}
          # Push commit only — don't push tag (avoids duplicate tag-push workflow)
          git push origin HEAD

  # ════════════════════════════════════════════════════════
  # Build jobs — run on tag push OR dispatch without version
  # ════════════════════════════════════════════════════════

  # ── Desktop (Electron) build ──
  build-desktop:
    needs: [create-tag]
    if: |
      !failure() && !cancelled()
      && (github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && inputs.platform != 'mobile-only'))
    strategy:
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # Use bumped commit when dispatched with version, else default
          ref: ${{ needs.create-tag.outputs.commit_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      # 先构建 core（桌面端从 @mplayer/core 的 dist 导入；dist 是 gitignored，
      # 干净环境必须显式构建，否则 tsc 报 Cannot find module '@mplayer/core'）
      - run: npm run core:build

      # 发布前跑测试：直接 push master 发版时 ci.yml 可能并行未完成，release 构建自带验证兜底
      - run: npx tsc && npx vitest run && npx vite build

      # 只构建不上传（--publish never）：产物统一上传 actions artifact，
      # 由 publish job 汇总上传到 GitHub Release。
      # 注意：不要用 --publish always —— 会与 publish job 的 gh release create 竞争，
      # electron-builder 因 release 已存在而 skipped publishing（实测 v1.7.2 桌面产物全丢）。
      - name: Build (Electron)
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: mplayer-desktop-${{ matrix.os }}
          path: |
            dist/**/*
          if-no-files-found: error

  # ── Mobile Android APK + AAB ──
  build-mobile:
    needs: [create-tag]
    if: |
      !failure() && !cancelled()
      && (github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && inputs.platform != 'desktop-only'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-tag.outputs.commit_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci --ignore-scripts
      - run: npm run core:build

      # Metro bundle 缓存（JS bundle 打包中间产物，跨 run 复用）
      - name: Cache Metro
        uses: actions/cache@v6
        with:
          path: |
            node_modules/.cache/metro
            ~/.expo
          key: ${{ runner.os }}-metro-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-metro-

      # Gradle 官方 setup（P1）：自动缓存依赖(modules-2)/Build Cache(build-cache-1)/
      # transforms-3(AAR 解包)/wrapper，配 gradle.properties 的 org.gradle.caching=true
      # 二次构建命中绝大多数编译产物。注意：不要与 actions/cache / setup-java cache:gradle 混用。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache: gradle
          cache-read-only: false

      # 解码 release keystore（P0，由 GitHub Secrets 提供 base64；密码不进库）
      - name: Decode release keystore
        working-directory: packages/mobile
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          ls -la android/app/release.keystore

      # android 原生目录已提交进 git（P1-3 CNG 反向），不再 prebuild —— 直接增量构建。
      # versionCode/versionName 由 build.gradle 从 app.json 显式读取（P3-9）。
      - name: Build APK + AAB (release)
        working-directory: packages/mobile/android
        run: ./gradlew assembleRelease bundleRelease --no-daemon
        env:
          GRADLE_OPTS: "-Xmx4096m"
          ANDROID_KEYSTORE_FILE: release.keystore
          ANDROID_KEYSTORE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
          ANDROID_KEYSTORE_KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_KEY_ALIAS }}
          ANDROID_KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}

      # gradle 默认产物名是 app-release.apk / app-release.aab；按「应用名 + 版本号」重命名，
      # 例如 MPlayer-v1.7.0.apk / MPlayer-v1.7.0.aab（与 electron-builder 桌面产物命名风格一致）
      - name: Rename artifacts with app name + version
        working-directory: packages/mobile/android/app/build/outputs
        run: |
          VERSION=$(node -p "require('/home/runner/work/mplayer/mplayer/package.json').version")
          for apk in apk/release/*.apk; do
            [ -f "$apk" ] || continue
            mv "$apk" "apk/release/MPlayer-v${VERSION}.apk"
          done
          for aab in bundle/release/*.aab; do
            [ -f "$aab" ] || continue
            mv "$aab" "bundle/release/MPlayer-v${VERSION}.aab"
          done
          ls -la apk/release bundle/release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: mplayer-mobile-apk
          path: packages/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: mplayer-mobile-aab
          path: packages/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  # ── Publish release ──
  publish:
    needs: [build-desktop, build-mobile]
    if: |
      always() && !cancelled()
      && needs.build-mobile.result == 'success'
      && (github.event_name == 'push' || inputs.version != '')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.version }}" ]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      # 下载全部构建产物：三个桌面平台 + mobile（APK + AAB）
      - name: Download desktop (linux) artifact
        uses: actions/download-artifact@v8
        with:
          name: mplayer-desktop-ubuntu-latest
          path: desktop-linux
      - name: Download desktop (mac) artifact
        uses: actions/download-artifact@v8
        with:
          name: mplayer-desktop-macos-latest
          path: desktop-mac
      - name: Download desktop (win) artifact
        uses: actions/download-artifact@v8
        with:
          name: mplayer-desktop-windows-latest
          path: desktop-win
      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: mplayer-mobile-apk
      - name: Download AAB artifact
        uses: actions/download-artifact@v8
        with:
          name: mplayer-mobile-aab

      - name: Create or edit release
        run: |
          TAG="${{ steps.tag.outputs.tag }}"

          if [ -z "$TAG" ]; then
            echo "No tag — skipping release publish"
            exit 0
          fi

          # Push tag for dispatch-with-version (create-tag only creates it locally)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f "$TAG"
            git push origin "$TAG" --force
          fi

          # Generate release notes
          gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="$TAG" --jq '.body' > release-notes.md

          # Create if not exists, otherwise edit
          if gh release view "$TAG" &>/dev/null; then
            gh release edit "$TAG" --notes-file release-notes.md --draft=false
          else
            gh release create "$TAG" --notes-file release-notes.md --draft=false
          fi

          # Upload 全部产物到 release assets：桌面三平台（含 latest-*.yml 更新元数据）
          # + mobile APK/AAB（AAB 供上架 Google Play 使用，P3-8）。
          # 统一在此上传，避免与 electron-builder 的 --publish always 竞争。
          # 注意：只遍历产物目录，绝不要包含 "."（会把仓库根目录源文件误传）。
          for dir in desktop-linux desktop-mac desktop-win ./*.apk ./*.aab; do
            if [ -d "$dir" ]; then
              for f in "$dir"/*; do
                [ -f "$f" ] && gh release upload "$TAG" "$f" --clobber || true
              done
            elif [ -f "$dir" ]; then
              gh release upload "$TAG" "$dir" --clobber
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

