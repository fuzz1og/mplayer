name: Bug 报告
description: 提交一个 bug 帮助改进 MPlayer
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交 bug！请尽量填写以下信息，越详细越容易复现和修复。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 桌面端 / 移动端，以及版本号（Settings 页可见，或 package.json 的 version）
      placeholder: e.g. 桌面端 1.6.0 / 移动端 1.6.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      multiple: true
      options:
        - Windows (Electron 桌面端)
        - macOS (Electron 桌面端)
        - Linux (Electron 桌面端)
        - Android (Expo)
        - iOS (Expo)
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: 涉及来源
      description: 若与某个具体音乐源相关，请勾选（可多选）
      multiple: true
      options:
        - netease
        - qq
        - kugou
        - migu
        - kuwo
        - qianqian
        - soda
        - 不限 / 不确定
  - type: input
    id: regression
    attributes:
      label: 最近正常版本
      description: 如果某版本之前正常、之后开始出问题，填那个正常版本号（帮助定位回归）
      placeholder: e.g. 1.5.2 正常，1.6.0 开始出错
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你希望发生什么
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么（与期望行为的差异）
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 看到报错 ...
    validations:
      required: true
  - type: dropdown
    id: reproducible
    attributes:
      label: 是否可稳定复现
      options:
        - 每次必现
        - 偶尔出现（附触发频率）
        - 只出现一次
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 报错信息、DevTools console 输出、截图等
