version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # 上限只是安全阀，不是策展工具。原先 10 条会被占满，把积压的 35 项更新
    # 静默挡住，直到旧 PR 清空才一次性放闸——分组已经负责收敛数量，这里上调避免再憋。
    open-pull-requests-limit: 20
    # 新版本先冷却再提 PR：避开「刚发布就被投毒」的窗口（安全更新不受 cooldown 限制）。
    # 冷却天数必须在 1~90；未显式配置时 Dependabot 也会默认冷却 3 天。
    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    # 把同类低风险升级合并成一个 PR，避免每周刷出十几条历史（#446）。
    # major 始终逐条提 PR，保留单独评估。
    groups:
      # production 只分组 patch。注意 semver 对 0.x 包的定义：minor 就是破坏性升级，
      # 实测 react-native 0.86→0.87、iconv-lite 0.6→0.7 都曾把 CI 打红，
      # 所以 production 的 minor 一律逐条提，不进分组。
      prod-patch:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - patch
      # development 依赖不随产物发布，且 CI 覆盖双端 typecheck + 测试，minor 可一并分组。
      dev-non-major:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # electron 由 electron-builder 配套版本管理，避免依赖混乱
      - dependency-name: electron
      - dependency-name: "@types/electron*"
      # vite 8 超出 @vitejs/plugin-react@4 peer 范围（^4||^5||^6||^7），只跟踪 6.x/7.x
      - dependency-name: vite
        versions: [">=8"]
      # react/react-dom 精确 pin（19.2.3），react-dom 新版本 peer 要求 react@^19.2.8，
      # 单独 bump 必然 ERESOLVE，须成对升级，这里整体忽略
      - dependency-name: react
      - dependency-name: react-dom
      # esbuild 与根 overrides 钉死同一版本（vite 经 override 统一解析），
      # 只 bump devDependency 会被 override 吃掉、只剩声明漂移；要升级须两处一起改，故不自动提 PR
      - dependency-name: esbuild
      # ── 生态耦合集：版本选择权归 Expo SDK，不归 semver 机器人 ──────────────
      # 为什么整组排除 minor+major（一手来源见 docs/research/2026-09-29-dependency-update-policy.md
      # 与 ADR docs/adr/2026-09-29-dependency-update-governance.md）：
      # - semver 规范 §4：0.y.z「Anything MAY change at any time」，0.x 的 minor 就是破坏性升级；
      # - Dependabot 只按 x.y.z 字面分位（官方原文："Dependabot assumes that versions in this
      #   form are always major.minor.patch."），识别不出 0.x 的破坏性 —— #478 的成因正是
      #   react-native 0.86.2 → 0.87.1 被当成 minor 混进 19 条的批次；
      # - Expo 官方要求 "Upgrade all dependencies to match the installed SDK version"，
      #   即期望版本由 SDK 决定，而不是「semver 允许的最新」。升级动作走 expo install --fix，
      #   一致性由 CI 的 expo-check job（scripts/verify.sh expo）兜住。
      # 事故的完整因果链（吸收 #481 的注释）：#466 把 react-native 抬到 0.87.1 → RN 0.87 的
      # gradle 插件把 AGP 提到 9.2.1 → AGP 9.2.1 要求 Gradle ≥9.4.1（仓库 wrapper 钉 9.3.1）
      # → 升到 9.4.1 后其内嵌 Kotlin 2.3.0 与 Expo 57 的 Kotlin 2.1.20 插件编译器冲突（#478）。
      # 只挡 version updates 的 minor/major；官方明文 update-types 不影响 security updates，
      # 所以每个包的 patch 与安全补丁照常提 PR。
      - dependency-name: "expo*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@react-native-community/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@react-native-masked-view/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@react-native-async-storage/async-storage"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # @vitejs/plugin-react 5+ 的 peer 是 vite ^8.0.0（只有 4.x 支持 vite ^4~^7）。
      # 要升它必须连 vite 8 一起升，属成对决策；采用 vite 8 前不提 PR（与上面 vite 的 ignore 呼应）
      - dependency-name: "@vitejs/plugin-react"
        versions: [">=5"]
      # typescript 7 目前装不上：typescript-eslint（含最新 8.71.0）peer 上限是 <6.1.0，
      # npm install 直接 ERESOLVE。6.x 仍可正常提；等上游支持 TS 7 再放开这条
      - dependency-name: typescript
        versions: [">=7"]
      # @babel/core 8 与 metro 冲突（metro 0.84 依赖 @babel/core ^7.25.2），
      # 须与 metro / RN 一并评估，不单独提 PR
      - dependency-name: "@babel/core"
        versions: [">=8"]
    labels:
      - dependencies
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
