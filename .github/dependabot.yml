version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # 上限只是安全阀，不是策展工具。原先 10 条会被占满，把积压的 35 项更新
    # 静默挡住，直到旧 PR 清空才一次性放闸——分组已经负责收敛数量，这里上调避免再憋。
    open-pull-requests-limit: 20
    # 新版本先冷却再提 PR：避开「刚发布就被投毒」的窗口（安全更新不受 cooldown 限制）。
    # 冷却天数必须在 1~90；未显式配置时 Dependabot 也会默认冷却 3 天。
    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    # 把同类低风险升级合并成一个 PR，避免每周刷出十几条历史（#446）。
    # major 始终逐条提 PR，保留单独评估。
    groups:
      # production 只分组 patch。注意 semver 对 0.x 包的定义：minor 就是破坏性升级，
      # 实测 react-native 0.86→0.87、iconv-lite 0.6→0.7 都曾把 CI 打红，
      # 所以 production 的 minor 一律逐条提，不进分组。
      prod-patch:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - patch
      # development 依赖不随产物发布，且 CI 覆盖双端 typecheck + 测试，minor 可一并分组。
      dev-non-major:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # electron 由 electron-builder 配套版本管理，避免依赖混乱
      - dependency-name: electron
      - dependency-name: "@types/electron*"
      # vite 8 超出 @vitejs/plugin-react@4 peer 范围（^4||^5||^6||^7），只跟踪 6.x/7.x
      - dependency-name: vite
        versions: [">=8"]
      # react/react-dom 精确 pin（19.2.3），react-dom 新版本 peer 要求 react@^19.2.8，
      # 单独 bump 必然 ERESOLVE，须成对升级，这里整体忽略
      - dependency-name: react
      - dependency-name: react-dom
      # esbuild 与根 overrides 钉死同一版本（vite 经 override 统一解析），
      # 只 bump devDependency 会被 override 吃掉、只剩声明漂移；要升级须两处一起改，故不自动提 PR
      - dependency-name: esbuild
      # async-storage 3.x 是破坏性大版本（scoped storage / 批量 API 改名 / Android 额外安装步骤），
      # 迁移前不自动提 PR，见 #446
      - dependency-name: "@react-native-async-storage/async-storage"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
