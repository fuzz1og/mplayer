appId: com.mplayer.app
productName: MPlayer
forceCodeSigning: false
afterPack: scripts/afterPack.js
# 安装包最大压缩（normal → maximum，体积再降 ~20-30%，代价是打包/安装稍慢）
compression: maximum
# 三平台统一只保留中文/英文语言包（mac 的 .lproj 与 win/linux 的 locale.pak 分别裁剪）
electronLanguages:
  - zh-CN
  - en-US
publish:
  provider: github
  owner: fuzz1og
  repo: mplayer
files:
  - dist/**/*
  - dist-electron/**/*
  - resources/icon.png
  - resources/icon.ico
  - resources/icon_tray.png
  - "!**/__tests__/**"
  - "!**/*.test.*"
  - "!**/*.spec.*"
  - "!dist/*.exe"
  # 二次打包会把上一轮产出的安装包卷进 asar（历史上体积 +64% 事故同款），产物扩展名全覆盖
  - "!dist/*.AppImage"
  - "!dist/*.deb"
  - "!dist/*.dmg"
  - "!dist/*.7z"
  - "!dist/*.zip"
  - "!dist/builder-*"
  # staging 目录按「平台+架构」命名；漏掉 mac-arm64 会把整份 Electron.app 卷进 asar（#718）
  - "!dist/win-*/**"
  - "!dist/mac*/**"
  - "!dist/linux*/**"
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  verifyUpdateCodeSignature: false
nsis:
  # 显式声明无空格产物名（#350）：默认模板 `${productName} Setup ${version}.${ext}` 带空格，
  # electron-builder 写 latest.yml 时会把空格换成 `-`（MPlayer-Setup-1.8.1.exe），
  # 而 CI 是 `--publish never` + publish job `gh release upload` 上传磁盘原名，
  # GitHub 又把空格规范成 `.`（MPlayer.Setup.1.8.1.exe）→ feed 名与资产名分叉 → 更新 404。
  # 磁盘名 = feed 名 = 资产名，三者必须逐字一致且无空格（一致性测试见
  # src/__tests__/main/updateService.test.ts）。
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  # 用户级安装：默认装到 %LOCALAPPDATA%\Programs，不需管理员权限，自更新不弹 UAC。
  # electron-builder 的默认值本来就是 false（NsisTarget 用 `perMachine === true` 判定），
  # 这里显式钉死是防止将来改动把安装模式悄悄变成 all-users。
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  # 同理：默认 `${productName} ${version}.${ext}` 亦含空格
  artifactName: ${productName}-${version}.${ext}
mac:
  icon: resources/icon.png
  # Electron 44 要求 macOS 13 (Ventura)+（breaking changes 44.0 移除 macOS 12 支持；
  # 官方 README 同款表述 "macOS (Ventura and up)"）。这里显式钉死，不依赖 Electron 自带的
  # deployment target —— 隐式值会随 Electron 版本漂移，而 README 的下载表已对外承诺 13。
  minimumSystemVersion: "13.0"
  # electron-builder 26 起公证不再靠 env 自动检测隐式触发，需显式开启（凭据仍走 CI 注入的
  # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID 三件套）。实测 26.15.7：
  # 无签名证书时公证随代码签名一并跳过（与 24 行为一致）；未来配置证书+公证凭据后自动生效
  notarize: true
  target:
    - target: dmg
      arch:
        - x64
        - arm64
linux:
  icon: resources/icon.png
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
