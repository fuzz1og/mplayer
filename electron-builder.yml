appId: com.mplayer.app
productName: MPlayer
forceCodeSigning: false
afterPack: scripts/afterPack.js
# 安装包最大压缩（normal → maximum，体积再降 ~20-30%，代价是打包/安装稍慢）
compression: maximum
publish:
  provider: github
  owner: fuzz1og
  repo: mplayer
files:
  - dist/**/*
  - dist-electron/**/*
  - resources/icon.png
  - resources/icon.ico
  - resources/icon_tray.png
  - "!**/__tests__/**"
  - "!**/*.test.*"
  - "!**/*.spec.*"
  - "!dist/*.exe"
  # 二次打包会把上一轮产出的安装包卷进 asar（历史上体积 +64% 事故同款），产物扩展名全覆盖
  - "!dist/*.AppImage"
  - "!dist/*.deb"
  - "!dist/*.dmg"
  - "!dist/*.7z"
  - "!dist/*.zip"
  - "!dist/builder-*"
  - "!dist/win-unpacked/**"
  - "!dist/mac/**"
  - "!dist/linux*/**"
win:
  icon: resources/icon.ico
  electronLanguages:
    - zh-CN
    - en-US
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  verifyUpdateCodeSignature: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  icon: resources/icon.png
  # electron-builder 26 起不再凭环境变量自动触发公证，必须显式开启（凭据由 CI 注入
  # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID 三件套；缺凭据时构建报错，
  # 宁可失败也不产出未经公证的 dmg —— Gatekeeper 会直接拦截未公证产物）
  notarize: true
  target:
    - target: dmg
      arch:
        - x64
        - arm64
linux:
  icon: resources/icon.png
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
