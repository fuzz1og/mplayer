appId: com.mplayer.app
productName: MPlayer
forceCodeSigning: false
publish:
  provider: github
  owner: fuzz1og
  repo: mplayer
files:
  - dist/**/*
  - dist-electron/**/*
  - resources/icon.png
  - resources/icon.ico
  - resources/icon_tray.png
  - "!**/__tests__/**"
  - "!**/*.test.*"
  - "!**/*.spec.*"
  - "!dist/*.exe"
  - "!dist/*.7z"
  - "!dist/*.zip"
  - "!dist/builder-*"
  - "!dist/win-unpacked/**"
  - "!dist/mac/**"
  - "!dist/linux*/**"
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  verifyUpdateCodeSignature: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  icon: resources/icon.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64
linux:
  icon: resources/icon.png
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
