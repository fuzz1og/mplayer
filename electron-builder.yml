appId: com.mplayer.app
productName: MPlayer
forceCodeSigning: false
publish:
  provider: github
  owner: t0nyst4
  repo: mplayer
files:
  - dist/**/*
  - dist-electron/**/*
  - resources/icon.png
  - resources/icon.ico
  - resources/icon_tray.png
  - "!**/__tests__/**"
  - "!**/*.test.*"
  - "!**/*.spec.*"
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  verifyUpdateCodeSignature: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  icon: resources/icon.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64
linux:
  icon: resources/icon.png
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
